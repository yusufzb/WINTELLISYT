[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wintellisyt"
version = "0.2.0"
description = "Reproducible wind turbine SCADA diagnostics, IEC power-curve auditing, and asset intelligence"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = [
    "wind-energy",
    "scada",
    "power-curve",
    "iec-61400",
    "wind-turbine-diagnostics",
    "yaw-misalignment",
    "condition-monitoring",
    "nicegui",
    "folium",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
v2 = ["scikit-learn>=1.4", "threadpoolctl>=3.2"]
ui = [
    "nicegui>=2.0",
    "plotly>=5.18",
    "folium>=0.16",
    "starlette>=0.36",
    "uvicorn>=0.27",
]
dev = [
    "httpx>=0.27",
    "matplotlib>=3.8",
    "ruff>=0.4,<1",
    "mypy>=1.8",
]
all = [
    "scikit-learn>=1.4",
    "threadpoolctl>=3.2",
    "nicegui>=2.0",
    "plotly>=5.18",
    "folium>=0.16",
    "starlette>=0.36",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "matplotlib>=3.8",
    "ruff>=0.4,<1",
    "mypy>=1.8",
]

[project.scripts]
wintellisyt = "wintellisyt.cli:main"
wintellisyt-ui = "wintellisyt.ui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"wintellisyt.data" = ["*.json", "*.md"]
"wintellisyt.power_curve" = ["*.md"]

[tool.mypy]
check_untyped_defs = true
ignore_missing_imports = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
